<!DOCTYPE html>
<html>
<head>
    <title>Free API Key!!</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --border: #2a2a3a;
            --border-glow: #3a3a5a;
            --text: #c8c8e0;
            --text-dim: #6060a0;
            --accent: #4f8aff;
            --accent-glow: rgba(79, 138, 255, 0.25);
            --btn-bg: #151525;
            --btn-hover: #1e1e35;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(79, 138, 255, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(120, 80, 255, 0.04) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0f 0%, #0d0d18 100%);
        }

        /* Scanline overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.07) 2px,
                rgba(0,0,0,0.07) 4px
            );
            pointer-events: none;
            z-index: 10;
        }

        .container {
            border: 1px solid var(--border);
            border-radius: 0.75em;
            padding: 3em 4em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8em;
            background: var(--surface);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 20px 60px rgba(0,0,0,0.6),
                0 0 40px rgba(79,138,255,0.06);
            position: relative;
        }

        .title {
            font-size: 1.3em;
            color: var(--text);
            letter-spacing: 0.05em;
            text-align: center;
        }

        .title span {
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        button {
            border: 1px solid var(--border-glow);
            border-radius: 0.5em;
            padding: 0.9em 2em;
            width: 14em;
            background: var(--btn-bg);
            color: var(--accent);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95em;
            letter-spacing: 0.05em;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
            text-shadow: 0 0 8px var(--accent-glow);
            box-shadow: 0 0 12px rgba(79,138,255,0.08), 0 2px 8px rgba(0,0,0,0.4);
        }

        button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(79,138,255,0.08), transparent 60%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow), 0 4px 16px rgba(0,0,0,0.5);
            transform: translateY(-1px);
        }

        button:hover::before {
            opacity: 1;
        }

        button:active {
            transform: translateY(0px);
        }

        .blink {
            animation: blink 1.4s step-end infinite;
            color: var(--accent);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        /* Video takeover */
        #video-container {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Get a <span>FREE</span> API Key<br>instantly <span class="blink">_</span></div>
        <button id="claim-btn">Claim Free Key Now</button>
        <div class="label" style="font-size:0.6em; color: #333355;">no strings attached · totally legit</div>
    </div>

    <div id="video-container">
        <video id="rick" src="https://dn720407.ca.archive.org/0/items/rick-roll/Rick%20Roll.mp4" controls></video>
    </div>

    <script>
        async function getLocoAndIp() {
            try {
                const response = await fetch("https://ipapi.co/json/");
                const data = await response.json();

                return {
                    loco: `${data.city}, ${data.region}, ${data.country_name}`,
                    ip: data.ip
                };
            } catch (error) {
                console.error("Error fetching IP location:", error);

                return {
                    loco: "Unknown",
                    ip: "Unknown"
                };
            }
        }

        async function getAPIKey(ip) {
            const b = new Uint8Array(16);
            crypto.getRandomValues(b);

            const newApiKey = Array.from(b)
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join('');

            try {
                const response = await fetch("https://api.3272010.xyz/resetApiKey", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer cc6e467190c8c5896796ff034a4073d4",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        IP: ip,
                        newApiKey
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                console.log("Success:", data);

            } catch (error) {
                console.error("Error:", error);
            }

            return newApiKey;
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                console.log("Copied to clipboard!");
                return true;
            } catch (err) {
                console.error("Failed to copy:", err);
                return false;
            }
        }

        document.getElementById('claim-btn').addEventListener('click', async () => {
            const { loco, ip } = await getLocoAndIp();

            alert('🎉 Congratulations! Your FREE API key is ready...');

            const apiKey = await getAPIKey(ip);

            await copyToClipboard(apiKey);

            prompt("The API key is now copied into your clipboard.\nBut you can copy here just in case anyways.", apiKey);

            alert("By the way, how's the weather at " + loco + "?");

            alert("Unless you have a stupid VPN.");

            alert("So this is why you should use the sponsor of this page\n\nRickVPN");

            const container = document.getElementById('video-container');
            const video = document.getElementById('rick');

            container.style.display = 'block';

            try {
                await video.play();
            } catch (err) {
                console.error("Autoplay blocked:", err);
            }
        });
    </script>
</body>
</html>
