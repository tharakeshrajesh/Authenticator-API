<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,sans-serif;">
  <div style="max-width:520px;margin:2rem auto;">
    <div style="background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e5e5e5;">

      <div style="background:#0C447C;padding:2rem;text-align:center;">
        <p style="color:#fff;font-size:18px;font-weight:500;margin:0;">Verify your email</p>
      </div>

      <div style="padding:2rem;">
        <p style="font-size:15px;color:#111;margin:0 0 6px;">Hi there,</p>
        <p style="font-size:14px;color:#555;line-height:1.6;margin:0 0 1.5rem;">Use the code below to verify your email address. This code expires in <span style="color:#111;font-weight:500;">{{.Expiration}}</span>.</p>

        <div style="text-align:center;margin:1.5rem 0;">
          <p style="font-size:36px;font-weight:500;letter-spacing:12px;color:#111;margin:0;">{{.OTPCode}}</p>
        </div>

        <div style="background:#f9f9f9;border-radius:8px;padding:12px 16px;margin-bottom:1.5rem;">
          <p style="font-size:13px;color:#888;margin:0;line-height:1.6;">If you didn't request this, you can safely ignore this email. Someone may have entered your address by mistake.</p>
        </div>
      </div>

      <div style="padding:1rem 2rem;border-top:1px solid #e5e5e5;text-align:center;">
        <p style="font-size:12px;color:#aaa;margin:0;">© 2026 <a href="https://authenticator.3272010.xyz">3272010.xyz</a></p>
      </div>

    </div>
  </div>
</body>
</html>
